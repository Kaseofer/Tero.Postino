name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Los paquetes Tero.* viven en GitHub Packages y el feed pide credenciales incluso para
    # paquetes públicos. nuget.config las toma de estas dos variables; sin ellas el restore
    # falla al buscar Tero.Contracts.
    env:
      GITHUB_PACKAGES_USER: ${{ github.actor }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

# El paso de imagen Docker se sacó a propósito.
#
# Fallaba desde la primera corrida, y era el único que hacía algo: los otros tres pasaban sin
# compilar nada porque Tero.Postino.slnx estaba vacío. Un CI en el que el único paso real falla
# y el resto miente no protege de nada.
#
# La imagen tampoco la consume nadie todavía: el entorno de desarrollo levanta los proyectos
# directamente. Cuando haya un destino que use la imagen, el paso vuelve — y para entonces el
# Dockerfile necesita además que se le pasen las credenciales del feed, que hoy no tiene forma
# de recibir.
