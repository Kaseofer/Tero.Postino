<!--
  No longer sends a plaintext password (BACKLOG.md #4): the admin sets their own password with
  a one-time link, same mechanism as PasswordReset.html. Placeholders: {{tenantName}}
  {{userEmail}} {{setPasswordUrl}} {{expirationMinutes}}.
-->
<div style="font-family: sans-serif; max-width: 480px;">
  <p>The admin account for <strong>{{tenantName}}</strong> was created.</p>
  <p><strong>Username:</strong> {{userEmail}}</p>
  <p>To activate it, set your password here:</p>
  <p><a href="{{setPasswordUrl}}">Set password</a></p>
  <p>This link expires in {{expirationMinutes}} minutes. If it expires before you use it, you
  can request a new one from "Forgot password" on the sign-in screen.</p>
</div>
