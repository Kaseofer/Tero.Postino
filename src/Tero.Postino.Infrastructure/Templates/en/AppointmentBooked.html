<!--
  See es/AppointmentBooked.html for the criteria behind this template (shared by all 4
  appointment notification varieties; the subject lives in a separate .subject.txt file,
  see BACKLOG.md #1). Placeholders: {{contactName}} {{serviceName}} {{appointmentDateTime}}
  {{location}} {{durationMinutes}}.
-->
<div style="font-family: sans-serif; max-width: 480px;">
  <p>Hello {{contactName}},</p>
  <p style="font-size: 16px;"><strong>{{serviceName}}</strong> — {{appointmentDateTime}}</p>
  ::optional:location::<p><strong>Location:</strong> {{location}}</p>::/optional::
  ::optional:durationMinutes::<p><strong>Duration:</strong> {{durationMinutes}} minutes</p>::/optional::
</div>
