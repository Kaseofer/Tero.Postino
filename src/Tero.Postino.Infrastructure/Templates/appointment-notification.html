<!--
  Plantilla de "AppointmentNotification" (confirmación, recordatorio, cancelación,
  reprogramación — el asunto ya distingue cuál es, ver SendAppointmentNotificationUseCase).

  Placeholders: {{contactName}} {{serviceName}} {{appointmentDateTime}} {{location}}
  {{description}} {{contactPhone}}. MailTemplateRenderer los reemplaza por texto plano — no
  hay lógica condicional en este archivo: si un campo opcional no vino, su fila queda vacía
  (::optional::) en vez de desaparecer. Es la opción simple a propósito: para "no mostrar la
  fila si falta el dato" hace falta un motor de plantillas de verdad (Handlebars, Scriban),
  que hoy sería una dependencia nueva para un solo tipo de mail.

  Editable con doble clic — es HTML común, se ve en cualquier navegador.
-->
<div style="font-family: sans-serif; max-width: 480px;">
  <p>Hola {{contactName}},</p>
  <p style="font-size: 16px;"><strong>{{serviceName}}</strong> — {{appointmentDateTime}}</p>
  <p>::optional:location::<strong>Ubicación:</strong> {{location}}::/optional::</p>
  <p>::optional:description::{{description}}::/optional::</p>
  <p>::optional:contactPhone::<strong>Contacto:</strong> {{contactPhone}}::/optional::</p>
</div>
